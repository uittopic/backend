# Cấu hình huấn luyện BLIP tiếng Việt (mẫu)
#
trainer:
  output_dir: models/blip_vietnamese
  num_train_epochs: 10  # Tăng epochs để model học tốt hơn tiếng Việt có dấu
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 3.0e-5  # Giảm learning rate một chút để học kỹ hơn
  warmup_steps: 500
  logging_steps: 20
  save_steps: 300
  evaluation_strategy: "no"
  fp16: true
  gradient_accumulation_steps: 2
  dataloader_num_workers: 0
  save_total_limit: 3
  resume_from_checkpoint: false  # Train lại từ đầu với config mới

data:
  csv_path: data/train_bilingual_clean_v2.csv
  images_dir: data/images
  image_column: image
  caption_column_vi: caption_vi
  caption_column_en: caption_en

model:
  pretrained_model_id: "Salesforce/blip-image-captioning-base"
  tokenizer_max_length: 77
  use_mps: true
  gradient_checkpointing: true


